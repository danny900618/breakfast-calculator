<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>早餐店計算機</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d97b3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="早餐計算機">
<style>
  :root {
    --bg: #fdf6ec;
    --card: #ffffff;
    --accent: #d97b3f;
    --accent-dark: #b8622d;
    --text: #3a2e26;
    --muted: #8a7b6e;
    --danger: #c0392b;
    --border: #eee0d0;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    user-select: none;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  header {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    background: var(--accent);
    color: white;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 1.6rem;
    margin: 0;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    align-content: start;
  }
  .product-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .product-name {
    font-size: 2.6rem;
    font-weight: 700;
  }
  .product-price {
    color: var(--muted);
    font-size: 2rem;
  }
  .qty-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .qty-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 2rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .qty-btn:active {
    background: var(--accent-dark);
  }
  .qty-btn.minus {
    background: #b0a495;
  }
  .qty-btn.minus:active {
    background: #948a7d;
  }
  .qty-btn.plus {
    font-size: 1.4rem;
  }
  .plus-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .qty-value {
    font-size: 2rem;
    font-weight: 700;
    min-width: 56px;
    text-align: center;
  }
  .subtotal {
    text-align: right;
    font-size: 2rem;
    color: var(--accent-dark);
    font-weight: 600;
  }
  footer.total-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    background: white;
    border-top: 1px solid var(--border);
  }
  .total {
    font-size: 2.4rem;
    font-weight: 700;
  }
  .total span {
    color: var(--accent-dark);
  }
  .clear-area {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  .clear-btn {
    padding: 16px 24px;
    font-size: 1.2rem;
    border: none;
    border-radius: 12px;
    background: var(--danger);
    color: white;
  }
  .clear-btn:active {
    opacity: 0.85;
  }
  .countdown {
    text-align: center;
    color: var(--muted);
    font-size: 1rem;
  }

  /* 平板橫放：3 欄 x 2 列，總計與清空放在右側欄 */
  @media (orientation: landscape) and (min-width: 700px) {
    .app {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: auto 1fr 1fr;
      grid-template-areas:
        "header header header"
        "p1     p2     total"
        "p4     p3     clear";
      gap: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }
    header { grid-area: header; }
    main, footer.total-bar { display: contents; }
    .product-card { justify-content: space-between; }
    .product-card:nth-child(1) { margin-left: 16px; }
    .product-card:nth-child(4) { margin-left: 16px; }
    .card-p1 { grid-area: p1; }
    .card-p2 { grid-area: p2; }
    .card-p3 { grid-area: p3; }
    .card-p4 { grid-area: p4; }
    .total {
      grid-area: total;
      margin-right: 16px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 2.8rem;
    }
    .total span { font-size: 4.2rem; }
    .clear-area {
      grid-area: clear;
      margin-right: 16px;
      gap: 10px;
    }
    .clear-btn {
      flex: 1;
      border-radius: 16px;
      font-size: 2rem;
    }
    .countdown { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>早餐店計算機</h1>
  </header>

  <main id="productList"></main>

  <footer class="total-bar">
    <div class="total">總計 <span id="totalAmount">$0</span></div>
    <div class="clear-area">
      <button id="clearBtn" class="clear-btn">清空</button>
      <div class="countdown"><span id="countdown">100</span> 秒後自動清空</div>
    </div>
  </footer>
</div>

<script>
(function () {
  // 商品名稱與價格寫死在這裡，要調整價格或品項直接改這個陣列即可
  var products = [
    { id: 'p1', name: '蔥仔條', price: 13 },
    { id: 'p2', name: '水煎包', price: 15 },
    { id: 'p3', name: '飲料(包)', price: 20 },
    { id: 'p4', name: '飲料(杯)', price: 15 }
  ];

  var quantities = {};
  products.forEach(function (p) { quantities[p.id] = 0; });

  var productListEl = document.getElementById('productList');
  var totalAmountEl = document.getElementById('totalAmount');

  function formatMoney(n) {
    return '$' + n.toLocaleString('en-US');
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderProducts() {
    productListEl.innerHTML = '';
    products.forEach(function (p) {
      var qty = quantities[p.id];
      var card = document.createElement('div');
      card.className = 'product-card card-' + p.id;
      card.innerHTML =
        '<div class="product-name">' + escapeHtml(p.name) + '</div>' +
        '<div class="product-price">單價 ' + formatMoney(p.price) + '</div>' +
        '<div class="qty-row">' +
          '<button class="qty-btn minus" data-id="' + p.id + '" data-dir="-1" aria-label="減少">－</button>' +
          '<div class="qty-value" id="qty-' + p.id + '">' + qty + '</div>' +
          '<div class="plus-col">' +
            '<button class="qty-btn plus" data-id="' + p.id + '" data-dir="10" aria-label="增加10">+10</button>' +
            '<button class="qty-btn plus" data-id="' + p.id + '" data-dir="5" aria-label="增加5">+5</button>' +
            '<button class="qty-btn plus" data-id="' + p.id + '" data-dir="1" aria-label="增加1">+1</button>' +
          '</div>' +
        '</div>' +
        '<div class="subtotal" id="subtotal-' + p.id + '">' + formatMoney(qty * p.price) + '</div>';
      productListEl.appendChild(card);
    });
    attachQtyHandlers();
    updateTotal();
  }

  function changeQty(id, delta) {
    var product = products.filter(function (p) { return p.id === id; })[0];
    if (!product) return;
    var next = (quantities[id] || 0) + delta;
    if (next < 0) next = 0;
    quantities[id] = next;
    document.getElementById('qty-' + id).textContent = next;
    document.getElementById('subtotal-' + id).textContent = formatMoney(next * product.price);
    updateTotal();
  }

  function updateTotal() {
    var total = 0;
    products.forEach(function (p) {
      total += (quantities[p.id] || 0) * p.price;
    });
    totalAmountEl.textContent = formatMoney(total);
  }

  function attachQtyHandlers() {
    var buttons = productListEl.querySelectorAll('.qty-btn');
    buttons.forEach(function (btn) {
      attachRepeatPress(btn, function () {
        changeQty(btn.getAttribute('data-id'), parseInt(btn.getAttribute('data-dir'), 10));
      });
    });
  }

  // press-and-hold repeat helper for +/- buttons
  function attachRepeatPress(el, callback) {
    var timeout = null;
    var interval = null;

    function start(e) {
      e.preventDefault();
      callback();
      timeout = setTimeout(function () {
        interval = setInterval(callback, 120);
      }, 450);
    }
    function stop() {
      clearTimeout(timeout);
      clearInterval(interval);
    }
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointerleave', stop);
    el.addEventListener('pointercancel', stop);
  }

  function clearAll() {
    products.forEach(function (p) { quantities[p.id] = 0; });
    renderProducts();
  }

  document.getElementById('clearBtn').addEventListener('click', clearAll);

  // 閒置倒數：IDLE_SECONDS 秒內沒有任何操作就自動清空，有操作就重新倒數
  var IDLE_SECONDS = 100;
  var countdownEl = document.getElementById('countdown');
  var remaining = IDLE_SECONDS;

  function resetCountdown() {
    remaining = IDLE_SECONDS;
    countdownEl.textContent = remaining;
  }

  setInterval(function () {
    remaining -= 1;
    if (remaining <= 0) {
      clearAll();
      resetCountdown();
      return;
    }
    countdownEl.textContent = remaining;
  }, 1000);

  document.addEventListener('pointerdown', resetCountdown, true);

  renderProducts();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
})();
</script>
</body>
</html>
